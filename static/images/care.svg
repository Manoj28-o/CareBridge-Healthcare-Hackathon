<rect x="136" y="56" width="10" height="26" rx="5" fill="#12263f"/><rect x="224" y="56" width="10" height="26" rx="5" fill="#12263f"/>
<circle cx="185" cy="168" r="30" fill="#2e9e6a"/><path d="M170 168l11 11 20-22" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
