<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-label="Calendar with a check mark and a shield">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d6fd8"/><stop offset="1" stop-color="#0f9d9a"/></linearGradient></defs>
<style>
.f{animation:f 5s ease-in-out infinite}.f2{animation:f 6s ease-in-out -3s infinite}@keyframes f{50%{transform:translateY(-10px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:s 22s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.ecg{stroke-dasharray:110;animation:e 2.6s linear infinite}@keyframes e{from{stroke-dashoffset:110}to{stroke-dashoffset:-110}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
